<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chương 4: Tính bền vững trong kinh doanh (ICAEW) - Flipbook A4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Merriweather:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --a4-w: 794px;
      --a4-h: 1123px;
      --icaew-teal: #006b68;
      --icaew-teal-dark: #004d4a;
      --icaew-teal-light: #e6f3f2;
      --icaew-accent: #0d9488;
      --paper-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      user-select: text;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Be Vietnam Pro', sans-serif;
      background: radial-gradient(circle at center, #263238 0%, #111827 100%);
      color: #1e293b;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }

    /* Thanh công cụ trên cùng */
    .toolbar {
      height: 54px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 50;
      color: #f8fafc;
      flex-shrink: 0;
    }

    .tool-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .tool-btn:hover:not(:disabled) {
      background: rgba(13, 148, 136, 0.35);
      border-color: rgba(45, 212, 191, 0.5);
      color: #ffffff;
    }

    .tool-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .tool-btn.active {
      background: #0d9488;
      border-color: #2dd4bf;
      color: #ffffff;
    }

    /* Khu vực sân khấu Flipbook */
    .stage-wrapper {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 2600px;
    }

    /* Khung sách được scale tự động vừa khít màn hình */
    .book-scaler {
      transform-origin: center center;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .book-spread {
      display: flex;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255,255,255,0.08);
      border-radius: 4px;
      background: #cbd5e1;
      position: relative;
    }

    /* Tờ giấy A4 chuẩn 794x1123px (210:297) */
    .a4-sheet {
      width: var(--a4-w);
      height: var(--a4-h);
      background: var(--paper-bg);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 34px 44px 28px 44px;
      color: #1e293b;
      font-size: 12.1px;
      line-height: 1.44;
      flex-shrink: 0;
    }

    /* Gáy sách đổ bóng chân thực khi xem 2 trang */
    .book-spread.two-page .a4-sheet.left-page {
      border-right: 1px solid #cbd5e1;
      box-shadow: inset -18px 0 28px -15px rgba(0, 0, 0, 0.14);
      border-top-left-radius: 4px;
      border-bottom-left-radius: 4px;
    }

    .book-spread.two-page .a4-sheet.right-page {
      box-shadow: inset 18px 0 28px -15px rgba(0, 0, 0, 0.14);
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
    }

    .book-spread.one-page .a4-sheet {
      border-radius: 4px;
      box-shadow: inset 8px 0 16px -10px rgba(0, 0, 0, 0.15);
    }

    /* Hiệu ứng animation lật trang */
    @keyframes flipNextAnim {
      0% { transform: rotateY(0deg); filter: brightness(1); }
      45% { transform: rotateY(-12deg) scale(0.99); filter: brightness(0.94); }
      100% { transform: rotateY(0deg); filter: brightness(1); }
    }

    @keyframes flipPrevAnim {
      0% { transform: rotateY(0deg); filter: brightness(1); }
      45% { transform: rotateY(12deg) scale(0.99); filter: brightness(0.94); }
      100% { transform: rotateY(0deg); filter: brightness(1); }
    }

    .anim-flip-next {
      animation: flipNextAnim 0.36s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .anim-flip-prev {
      animation: flipPrevAnim 0.36s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Header & Footer chuẩn tài liệu ICAEW trên mỗi trang A4 */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      color: #64748b;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 5px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .page-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      overflow: hidden;
    }

    .page-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      padding-top: 5px;
      margin-top: 8px;
      flex-shrink: 0;
    }

    /* Typography học thuật ICAEW */
    .sec-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(90deg, var(--icaew-teal) 0%, var(--icaew-teal-dark) 100%);
      color: #ffffff;
      padding: 8px 14px;
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .sec-num {
      background: #ffffff;
      color: var(--icaew-teal-dark);
      font-weight: 800;
      font-size: 15px;
      width: 26px;
      height: 26px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sec-title {
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .h2-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--icaew-teal-dark);
      margin: 8px 0 4px 0;
      border-bottom: 1.5px solid #ccfbf1;
      padding-bottom: 2px;
    }

    .h3-title {
      font-size: 12.2px;
      font-weight: 700;
      color: #0f766e;
      margin: 6px 0 3px 0;
    }

    p {
      margin: 0 0 6px 0;
      text-align: justify;
    }

    ul.icaew-list {
      margin: 0 0 6px 0;
      padding-left: 16px;
      list-style-type: none;
    }

    ul.icaew-list li {
      position: relative;
      margin-bottom: 3.5px;
      text-align: justify;
    }

    ul.icaew-list li::before {
      content: "•";
      color: var(--icaew-teal);
      font-weight: 800;
      position: absolute;
      left: -13px;
    }

    /* Các hộp đặc trưng ICAEW */
    .box-overview {
      background: #f0fdfa;
      border-left: 4px solid var(--icaew-teal);
      border-radius: 0 6px 6px 0;
      padding: 8px 12px;
      margin-bottom: 8px;
    }

    .box-overview-title {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--icaew-teal-dark);
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .box-def {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-left: 4px solid #0284c7;
      border-radius: 5px;
      padding: 7px 11px;
      margin: 6px 0;
    }

    .box-def-label {
      font-size: 9.8px;
      font-weight: 800;
      text-transform: uppercase;
      color: #0369a1;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
    }

    .box-context {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-left: 4px solid #d97706;
      border-radius: 5px;
      padding: 7px 11px;
      margin: 6px 0;
    }

    .box-context-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: #b45309;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .box-worked {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-left: 4px solid #2563eb;
      border-radius: 5px;
      padding: 7px 11px;
      margin: 6px 0;
    }

    .box-worked-label {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      color: #1d4ed8;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .box-iq {
      background: #f5f3ff;
      border: 1px solid #ddd6fe;
      border-left: 4px solid #7c3aed;
      border-radius: 6px;
      padding: 8px 12px;
      margin: 6px 0;
    }

    .box-iq-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: #6d28d9;
      margin-bottom: 4px;
    }

    .box-sol {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 5px;
      padding: 6px 10px;
      margin-top: 5px;
    }

    .box-sol-label {
      font-size: 9.8px;
      font-weight: 800;
      text-transform: uppercase;
      color: #047857;
      margin-bottom: 2px;
    }

    /* Bảng biểu chuẩn ICAEW */
    table.icaew-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.6px;
      line-height: 1.35;
      margin: 5px 0;
    }

    table.icaew-table th {
      background: var(--icaew-teal);
      color: #ffffff;
      font-weight: 700;
      text-align: left;
      padding: 5px 7px;
      border: 1px solid var(--icaew-teal-dark);
    }

    table.icaew-table td {
      padding: 5px 7px;
      border: 1px solid #cbd5e1;
      vertical-align: top;
    }

    table.icaew-table tr:nth-child(even) td {
      background: #f8fafc;
    }

    /* Nút điều hướng nổi hai bên */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 68px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 40;
      transition: all 0.2s;
      backdrop-filter: blur(6px);
    }

    .nav-arrow:hover:not(:disabled) {
      background: #0d9488;
      border-color: #2dd4bf;
    }

    .nav-arrow:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .nav-arrow.prev {
      left: 0;
      border-radius: 0 12px 12px 0;
    }

    .nav-arrow.next {
      right: 0;
      border-radius: 12px 0 0 12px;
    }

    /* Sidebar Mục lục & Tìm kiếm */
    .drawer {
      position: fixed;
      top: 54px;
      bottom: 34px;
      width: 340px;
      max-width: 90vw;
      background: rgba(15, 23, 42, 0.97);
      backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
      z-index: 60;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-right {
      left: auto;
      right: 0;
      border-right: none;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      transform: translateX(100%);
    }

    .drawer-right.open {
      transform: translateX(0);
    }

    /* Thanh trạng thái dưới cùng */
    .bottom-bar {
      height: 34px;
      background: rgba(15, 23, 42, 0.96);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #94a3b8;
      font-size: 11.5px;
      flex-shrink: 0;
      z-index: 50;
    }

    .highlight-mark {
      background-color: #fef08a;
      color: #854d0e;
      padding: 0 2px;
      border-radius: 2px;
      font-weight: 600;
    }

    /* Sơ đồ tư duy trang 47-49 */
    .mm-root {
      background: var(--icaew-teal);
      color: white;
      font-weight: 800;
      text-align: center;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin: 0 auto 8px auto;
      width: fit-content;
      box-shadow: 0 2px 6px rgba(0,107,104,0.25);
    }

    .mm-topic {
      background: #e6f3f2;
      border: 1.5px solid var(--icaew-teal);
      color: var(--icaew-teal-dark);
      font-weight: 700;
      text-align: center;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      margin: 0 auto 6px auto;
      width: fit-content;
    }

    .mm-card {
      background: #ffffff;
      border: 1px solid #99f6e4;
      border-top: 3px solid var(--icaew-teal);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 10.2px;
      line-height: 1.32;
    }

    .mm-card-title {
      font-weight: 700;
      color: var(--icaew-teal-dark);
      margin-bottom: 3px;
      font-size: 10.6px;
    }

    @media print {
      body { background: white; overflow: visible; height: auto; }
      .toolbar, .bottom-bar, .nav-arrow, .drawer { display: none !important; }
      .stage-wrapper { overflow: visible; display: block; }
      .book-scaler { transform: none !important; display: block; }
      .a4-sheet { page-break-after: always; box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body>

  <!-- Thanh công cụ điều khiển -->
  <header class="toolbar">
    <div class="flex items-center gap-2">
      <button id="btnToc" class="tool-btn" title="Mở Mục lục Chương 4">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        <span class="hidden sm:inline">Mục lục</span>
      </button>
      <div class="hidden md:flex items-center gap-2 ml-1">
        <span class="px-2 py-0.5 rounded bg-teal-700 text-white text-xs font-bold tracking-wider">ICAEW</span>
        <span class="text-xs font-semibold text-slate-200 truncate max-w-[240px]">Chương 4: Tính bền vững trong kinh doanh</span>
      </div>
    </div>

    <!-- Điều hướng trang trung tâm -->
    <div class="flex items-center gap-1.5">
      <button id="btnFirst" class="tool-btn" title="Trang đầu">⏮</button>
      <button id="btnPrev" class="tool-btn" title="Trang trước (Mũi tên Trái)">◀ <span class="hidden sm:inline">Trước</span></button>
      
      <div class="flex items-center bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs">
        <span class="text-slate-400 mr-1">Trang</span>
        <input id="pageInput" type="number" min="1" max="55" value="1" class="w-10 bg-transparent text-center font-bold text-teal-300 focus:outline-none">
        <span class="text-slate-400 ml-1">/ 55</span>
      </div>

      <button id="btnNext" class="tool-btn" title="Trang sau (Mũi tên Phải)"><span class="hidden sm:inline">Sau</span> ▶</button>
      <button id="btnLast" class="tool-btn" title="Trang cuối">⏭</button>
    </div>

    <!-- Công cụ hiển thị, âm thanh & tải file -->
    <div class="flex items-center gap-1.5">
      <button id="btnViewMode" class="tool-btn" title="Chuyển đổi 1 trang A4 nguyên trang / 2 trang song song">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
        <span id="viewModeLabel" class="hidden lg:inline">1 Trang A4</span>
      </button>

      <button id="btnZoomOut" class="tool-btn" title="Thu nhỏ">−</button>
      <button id="btnZoomReset" class="tool-btn" title="Vừa khít màn hình (Fit A4)">100%</button>
      <button id="btnZoomIn" class="tool-btn" title="Phóng to">+</button>

      <button id="btnSound" class="tool-btn active" title="Bật/Tắt âm thanh lật giấy">
        <span id="soundIcon">🔊</span>
        <span class="hidden xl:inline">Âm lật trang</span>
      </button>

      <button id="btnSearch" class="tool-btn" title="Tìm kiếm từ khóa trong toàn bộ 55 trang">
        🔍 <span class="hidden md:inline">Tìm</span>
      </button>

      <button id="btnFullscreen" class="tool-btn hidden sm:inline-flex" title="Toàn màn hình">⛶</button>

      <button id="btnDownload" class="tool-btn bg-teal-700/60 border-teal-500/50" title="Tải về file HTML Flipbook hoàn chỉnh">
        ⬇ <span class="hidden md:inline">Tải về</span>
      </button>
    </div>
  </header>

  <!-- Ngăn kéo Mục lục -->
  <aside id="tocDrawer" class="drawer">
    <div class="p-3.5 border-b border-slate-700 flex items-center justify-between">
      <h2 class="font-bold text-sm text-teal-300 uppercase tracking-wide">Mục lục Chương 4 (55 Trang)</h2>
      <button id="closeToc" class="text-slate-400 hover:text-white text-lg leading-none">✕</button>
    </div>
    <div id="tocList" class="flex-1 overflow-y-auto p-2 space-y-1 text-xs"></div>
  </aside>

  <!-- Ngăn kéo Tìm kiếm -->
  <aside id="searchDrawer" class="drawer drawer-right">
    <div class="p-3.5 border-b border-slate-700 flex items-center justify-between">
      <h2 class="font-bold text-sm text-teal-300 uppercase tracking-wide">Tìm kiếm toàn văn</h2>
      <button id="closeSearch" class="text-slate-400 hover:text-white text-lg leading-none">✕</button>
    </div>
    <div class="p-3 border-b border-slate-800">
      <input id="searchInput" type="text" placeholder="Nhập từ khóa tiếng Việt..." class="w-full px-3 py-2 rounded-lg bg-slate-800 border border-slate-600 text-white text-xs focus:outline-none focus:border-teal-400">
      <div id="searchStats" class="text-[11px] text-slate-400 mt-1.5">Nhập từ khóa để tìm trong 55 trang</div>
    </div>
    <div id="searchResults" class="flex-1 overflow-y-auto p-2 space-y-1.5 text-xs"></div>
  </aside>

  <!-- Sân khấu chính hiển thị A4 nguyên trang -->
  <main id="stage" class="stage-wrapper">
    <button id="floatPrev" class="nav-arrow prev" title="Trang trước">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg>
    </button>

    <div id="bookScaler" class="book-scaler">
      <div id="bookSpread" class="book-spread one-page"></div>
    </div>

    <button id="floatNext" class="nav-arrow next" title="Trang sau">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </main>

  <!-- Thanh tiến trình dưới cùng -->
  <footer class="bottom-bar">
    <div class="flex items-center gap-3">
      <span id="currentSectionLabel" class="text-slate-300 font-medium truncate max-w-[320px] sm:max-w-[500px]">Bìa Chương 4: Tính bền vững trong kinh doanh</span>
    </div>
    <div class="flex items-center gap-3">
      <input id="progressSlider" type="range" min="1" max="55" value="1" class="w-28 sm:w-44 accent-teal-500 cursor-pointer">
      <span id="zoomPercentLabel" class="font-mono text-teal-400">Fit</span>
    </div>
  </footer>

  <script>
    // =========================================================================
    // 1. BỘ TỔNG HỢP ÂM THANH LẬT GIẤY CHÂN THỰC (WEB AUDIO API)
    // =========================================================================
    class PaperSoundEngine {
      constructor() {
        this.enabled = true;
        this.ctx = null;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playFlip() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;

          const now = this.ctx.currentTime;
          const duration = 0.28;
          const bufferSize = Math.floor(this.ctx.sampleRate * duration);
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);

          // Tạo nhiễu trắng kết hợp điều biến biên độ mô phỏng tiếng ma sát sợi giấy
          for (let i = 0; i < bufferSize; i++) {
            const t = i / bufferSize;
            const env = Math.sin(t * Math.PI) * Math.pow(1 - t, 0.55);
            const crinkle = 0.75 + 0.25 * Math.sin(i * 0.045) * Math.cos(i * 0.017);
            data[i] = (Math.random() * 2 - 1) * env * crinkle;
          }

          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;

          // Bộ lọc thông dải mô phỏng tần số cộng hưởng của tờ giấy A4
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(950, now);
          filter.frequency.exponentialRampToValueAtTime(2400, now + duration * 0.65);
          filter.frequency.exponentialRampToValueAtTime(1100, now + duration);
          filter.Q.value = 1.6;

          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.01, now);
          gain.gain.linearRampToValueAtTime(0.32, now + 0.06);
          gain.gain.exponentialRampToValueAtTime(0.005, now + duration);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);

          noise.start(now);
          noise.stop(now + duration);
        } catch (e) {
          // Bỏ qua lỗi audio nếu trình duyệt chặn autoplay
        }
      }

          <h2 class="h2-title">1.1 Chiến lược doanh nghiệp là gì?</h2>
          <p>Có nhiều định nghĩa khác nhau về 'chiến lược'. Một định nghĩa được sử dụng rộng rãi là:</p>

          <p>Từ định nghĩa này, chúng ta có thể nói rằng chiến lược liên quan đến:</p>

          <h2 class="h2-title">1.2 Chuỗi giá trị (Value chain)</h2>
          <p>Có những định nghĩa khác nhau về 'chuỗi giá trị' và chúng ta phải cẩn thận phân biệt định nghĩa doanh nghiệp rộng hơn với định nghĩa được sử dụng trong bối cảnh bền vững.</p>
          <p>Trước tiên, chúng ta sẽ xem xét mô hình chuỗi giá trị của các hoạt động doanh nghiệp do Michael Porter phát triển. Chúng ta sẽ gọi đây là chuỗi giá trị của Porter xuyên suốt tài liệu học tập này. Chuỗi giá trị của Porter cung cấp cái nhìn toàn cảnh về doanh nghiệp và những gì doanh nghiệp làm nhưng không xem xét cụ thể đến tính bền vững.</p>

          <h3 class="h3-title">1.2.1 Chuỗi giá trị của Porter</h3>
          <p>Porter cho rằng lợi thế cạnh tranh phát sinh từ cách thức các doanh nghiệp tổ chức và thực hiện các hoạt động bằng cách tiếp nhận các nguồn lực đầu vào, xử lý và bán chúng cho khách hàng. Các hoạt động có thể là yếu tố thúc đẩy giá trị (value drivers) hoặc yếu tố thúc đẩy chi phí (cost drivers). Porter (2004) đã nhóm các hoạt động khác nhau của một tổ chức thành một chuỗi giá trị.</p>

          <p><strong>Các hoạt động chính (Primary activities)</strong> liên quan trực tiếp đến sản xuất, vận hành, bán hàng, tiếp thị, giao nhận và dịch vụ.</p>
          <p><strong>Các hoạt động hỗ trợ (Support activities)</strong> cung cấp các yếu tố đầu vào được mua sắm, nguồn nhân lực, công nghệ và các chức năng cơ sở hạ tầng để hỗ trợ cho các hoạt động chính.</p>
          <p>Các hoạt động trong chuỗi giá trị có sự liên kết với nhau:</p>
          <ul class="icaew-list">
            <li>Các hoạt động trong chuỗi giá trị tác động qua lại lẫn nhau. Ví dụ, việc thiết kế sản phẩm tốn kém hơn hoặc sản xuất với chất lượng tốt hơn có thể làm giảm nhu cầu dịch vụ hậu mãi.</li>
            <li>Các mối liên kết đòi hỏi sự phối hợp. Ví dụ, việc giảm mức hàng tồn kho nắm giữ đòi hỏi sự vận hành trơn tru của hoạt động sản xuất, hậu cần đầu ra và các hoạt động dịch vụ như lắp đặt.</li>
          </ul>

          <h3 class="h3-title">1.2.2 Sử dụng chuỗi giá trị của Porter</h3>
          <p>Một doanh nghiệp có thể giành được lợi thế cạnh tranh bằng cách:</p>
          <ul class="icaew-list">
            <li>phát minh ra các cách thức mới hoặc tốt hơn để thực hiện các hoạt động;</li>
            <li>kết hợp các hoạt động theo những cách thức mới hoặc tốt hơn; hoặc</li>
            <li>quản lý các mối liên kết để tăng hiệu quả và giảm chi phí.</li>
          </ul>

          <h3 class="h3-title">1.2.3 Chuỗi giá trị và tính bền vững</h3>
          <p>Chuỗi giá trị cũng là một thuật ngữ được sử dụng dưới góc độ bền vững. Hội đồng Chuẩn mực Bền vững Quốc tế (ISSB) đưa ra định nghĩa về chuỗi giá trị có thể được sử dụng khi xem xét tính bền vững trong kinh doanh.</p>
          <div class="box-def">
            <div class="box-def-label">Định nghĩa</div>
            <p style="margin:0;"><strong>Chuỗi giá trị (định nghĩa của ISSB):</strong> Toàn bộ phạm vi các hoạt động, nguồn lực và mối quan hệ liên quan đến mô hình kinh doanh của đơn vị báo cáo và môi trường bên ngoài mà đơn vị đó hoạt động. Điều này bao gồm tất cả các tương tác và nguồn lực từ các nhà cung cấp thượng nguồn đến khách hàng hạ nguồn, bao quát toàn bộ vòng đời của một sản phẩm hoặc dịch vụ. <em>(IFRS S1: Phụ lục A Thuật ngữ định nghĩa)</em></p>
          </div>
          <p style="margin-bottom:0;">Định nghĩa về chuỗi giá trị của ISSB và của Porter đều xem xét cách thức giá trị được tạo ra và duy trì trong một doanh nghiệp, đồng thời nhấn mạnh tầm quan trọng của việc phân tích tất cả các hoạt động và tương tác đóng góp vào sản phẩm hoặc dịch vụ cuối cùng. Mô hình của Porter tập trung vào lợi thế cạnh tranh và hiệu quả hoạt động (có thể bao gồm các quyết định hướng đến tính bền vững), trong khi định nghĩa của ISSB lồng ghép trực tiếp tính bền vững và tác động rộng lớn hơn đối với môi trường và xã hội.</p>

          <h3 class="h3-title" style="margin-top:0;">1.2.5 Mua sắm và chuỗi cung ứng</h3>
          <div class="box-def">
            <div class="box-def-label">Các định nghĩa</div>
            <p><strong>Chuỗi cung ứng (Supply chain):</strong> Một chuỗi cung ứng đề cập đến toàn bộ mạng lưới các đơn vị, nguồn lực, hoạt động và công nghệ tham gia vào việc tạo ra, sản xuất và giao một sản phẩm từ nguyên liệu thô đến người tiêu dùng cuối cùng. Nó bao gồm cả các hoạt động thượng nguồn và hạ nguồn.</p>
            <p><strong>Các hoạt động thượng nguồn (Upstream activities):</strong> Các hoạt động thượng nguồn bao gồm các quy trình liên quan đến các giai đoạn đầu của quá trình sản xuất, chẳng hạn như khai thác nguyên liệu thô, quản lý nhà cung cấp và sản xuất.</p>
            <p style="margin:0;"><strong>Các hoạt động hạ nguồn (Downstream activities):</strong> Các hoạt động hạ nguồn bao gồm các quy trình diễn ra sau khi sản xuất, chẳng hạn như phân phối, lưu kho và giao hàng đến người tiêu dùng cuối cùng.</p>
          </div>

          <p>Trong một chuỗi cung ứng, các nhà cung cấp có thể được phân loại thành Cấp 1 (Tier 1) hoặc Cấp 2 (Tier 2).</p>
          <div class="box-def">
            <div class="box-def-label">Các định nghĩa</div>
            <p><strong>Nhà cung cấp cấp 1 (Tier 1 suppliers):</strong> Các nhà cung cấp trực tiếp cho công ty, cung cấp các linh kiện hoặc sản phẩm được sử dụng ngay lập tức trong quy trình sản xuất.</p>
            <p style="margin:0;"><strong>Nhà cung cấp cấp 2 (Tier 2 suppliers):</strong> Các nhà cung cấp cấp 2 cung cấp sản phẩm hoặc dịch vụ cho các nhà cung cấp cấp 1. Những nhà cung cấp này ở xa sản phẩm cuối cùng hơn một bước nhưng vẫn là một phần không thể thiếu của chuỗi cung ứng.</p>
          </div>

          <p>Một góc nhìn đơn giản về hoạt động hỗ trợ mua sắm sẽ cho rằng nó chỉ đơn thuần là đạt được mức giá tốt nhất từ các nhà cung cấp cho hàng hóa và dịch vụ có chất lượng tốt nhất, dựa trên mối quan hệ giao dịch ngang giá (arm's length relationship) với nhà cung cấp. Một doanh nghiệp muốn trở nên bền vững hoặc cải thiện tính bền vững trong hoạt động của mình phải tập trung vào các yếu tố không thuần túy về tài chính. Ví dụ, họ phải xem xét:</p>

          <h3 class="h3-title">3.2.6 Các nguồn cơ hội khác (Other sources of opportunities)</h3>
          <p>Tương tự như các rủi ro đã thảo luận ở trên, có thể có những cơ hội phát sinh cho doanh nghiệp không liên quan trực tiếp đến biến đổi khí hậu:</p>

            <li><strong>Khoảng trống thị trường (Market gaps):</strong> Việc xác định và giải quyết các khoảng trống trên thị trường có thể dẫn đến những cơ hội đáng kể. Ví dụ, các doanh nghiệp cung cấp giải pháp bền vững cho các thị trường chưa được phục vụ đầy đủ có thể giành được lợi thế cạnh tranh.</li>
            <li><strong>Thay đổi quy định pháp luật:</strong> Những thay đổi trong quy định có thể mở ra các thị trường mới hoặc đòi hỏi sự đổi mới sáng tạo. Các doanh nghiệp đón đầu xu hướng quy định hoặc nhận thấy mình đã cung cấp các sản phẩm hoặc dịch vụ phù hợp với hướng đi mới có thể tận dụng những thay đổi này.</li>

          </ul>

          <h2 class="h2-title" style="margin-top:0;">3.3 Giá trị doanh nghiệp và giá trị xã hội</h2>
          <p>Ngày càng có sự công nhận rộng rãi rằng các yếu tố ngoài hiệu quả tài chính cũng ảnh hưởng đến giá trị của một doanh nghiệp. Các rủi ro và cơ hội liên quan đến tính bền vững tác động đáng kể đến giá trị doanh nghiệp bằng cách ảnh hưởng đến hiệu quả tài chính, danh tiếng và khả năng tồn tại lâu dài của công ty.</p>

          <div class="box-def">
            <div class="box-def-label">Định nghĩa</div>
            <p style="margin:0;"><strong>Giá trị doanh nghiệp (Enterprise value):</strong> Giá trị doanh nghiệp phản ánh kỳ vọng về quy mô, thời điểm và tính chắc chắn của các dòng tiền trong tương lai trong ngắn hạn, trung hạn và dài hạn.</p>
          </div>

          <p>Giá trị doanh nghiệp được các nhà đầu tư, hoặc các nhà đầu tư tiềm năng, xem xét trong một doanh nghiệp. Các nhà đầu tư sử dụng giá trị doanh nghiệp để đánh giá giá trị thực sự của một doanh nghiệp. Trong lịch sử, họ thường dựa vào báo cáo tài chính của doanh nghiệp để xác định giá trị doanh nghiệp; tuy nhiên, ngày càng có sự công nhận rằng các rủi ro và cơ hội liên quan đến tính bền vững là những đầu vào thiết yếu để đánh giá giá trị doanh nghiệp.</p>
          <p>Các nhà đầu tư đánh giá một doanh nghiệp bằng cách xem xét <strong>quy mô (amount)</strong>, <strong>thời điểm (timing)</strong> và <strong>tính chắc chắn (certainty)</strong> của dòng tiền. Quy mô dòng tiền đề cập đến số tiền dự kiến được tạo ra hoặc sử dụng; thời điểm xem xét khi nào dòng tiền sẽ phát sinh; và tính chắc chắn đề cập đến độ tin cậy hoặc khả năng dự đoán của các dòng tiền này. Bằng cách đánh giá các yếu tố này, nhà đầu tư có thể xác định lợi nhuận tiềm năng và rủi ro gắn liền với việc đầu tư vào doanh nghiệp.</p>
          <p>Như chúng ta đã thấy ở trên, các rủi ro liên quan đến tính bền vững có thể dẫn đến tăng chi phí hoạt động, giảm doanh thu và tổn hại danh tiếng của doanh nghiệp. Ví dụ, một doanh nghiệp không quản lý tốt tác động môi trường có thể đối mặt với tiền phạt, trách nhiệm pháp lý và mất niềm tin của khách hàng. Ngoài ra, các rủi ro liên quan đến khí hậu có thể ảnh hưởng đến giá trị tài sản của doanh nghiệp và làm tăng chi phí bảo hiểm. Những rủi ro này cũng có thể tác động đến các quyết định mà nhà đầu tư đưa ra về việc cung cấp vốn cho doanh nghiệp.</p>
          <p>Các cơ hội liên quan đến tính bền vững có thể nâng cao giá trị doanh nghiệp bằng cách thúc đẩy đổi mới sáng tạo, cải thiện hiệu quả và mở ra các thị trường mới. Các công ty đầu tư vào năng lượng tái tạo, hiệu quả năng lượng và sản phẩm bền vững có thể giảm chi phí vận hành và thu hút người tiêu dùng có ý thức bảo vệ môi trường. Điều này có thể dẫn đến khả năng tiếp cận tài chính tốt hơn, nhu cầu tăng lên và cải thiện quan hệ với nhân viên, tất cả đều đóng góp tích cực vào sự ổn định và tăng trưởng tài chính tổng thể.</p>
          <p>Bằng cách xác định và quản lý hiệu quả các rủi ro liên quan đến tính bền vững cũng như tận dụng các cơ hội, một doanh nghiệp có thể gia tăng giá trị của mình.</p>

          <h3 class="h3-title">3.3.1 Giá trị xã hội (Social value)</h3>
          <p>Vốn xã hội cũng được các nhà đầu tư và các bên liên quan xem xét, những người nhận thức được tầm quan trọng của nó đối với thành công lâu dài của doanh nghiệp. Các rủi ro và cơ hội liên quan đến tính bền vững tác động đáng kể đến giá trị xã hội bằng cách định hình các mối quan hệ và niềm tin mà doanh nghiệp xây dựng với các bên liên quan.</p>

          <div class="box-def">
            <div class="box-def-label">Định nghĩa</div>
            <p style="margin:0;"><strong>Giá trị xã hội (Social value):</strong> Giá trị xã hội đề cập đến những tác động tích cực mà một doanh nghiệp mang lại cho xã hội, bao gồm phúc lợi của nhân viên, khách hàng, nhà cung cấp và cộng đồng. Bằng cách tạo ra giá trị xã hội mạnh mẽ, doanh nghiệp có thể nâng cao danh tiếng, tăng lòng trung thành của khách hàng và xây dựng môi trường làm việc tích cực, tất cả đều góp phần vào sự tăng trưởng bền vững.</p>
          </div>

          <p>Mối quan hệ giữa giá trị xã hội và giá trị doanh nghiệp nằm ở sự công nhận ngày càng tăng rằng các thực hành bền vững và có trách nhiệm với xã hội có thể nâng cao hiệu quả tài chính dài hạn của công ty. Bằng cách tích hợp giá trị xã hội vào mô hình kinh doanh, các công ty có thể xây dựng mối quan hệ bền chặt hơn với các bên liên quan, giảm thiểu rủi ro và tạo ra các cơ hội tăng trưởng mới.</p>
          <p style="margin-bottom:0;">Các rủi ro liên quan đến tính bền vững và cách doanh nghiệp quản lý, ứng phó với những rủi ro đó có thể làm tổn hại đến giá trị xã hội. Ví dụ, sự khan hiếm tài nguyên là một rủi ro liên quan đến tính bền vững có thể dẫn đến cạnh tranh gia tăng về tài nguyên và bất ổn xã hội tiềm ẩn, gây tác động tiêu cực đến xã hội. Các rủi ro liên quan đến tính bền vững bắt nguồn từ quản trị kém có thể dẫn đến các vấn đề lao động hoặc quản lý không thỏa đáng các tác động môi trường, gây tổn hại danh tiếng, mất niềm tin của các bên liên quan và cuối cùng làm suy giảm giá trị xã hội. Những rủi ro này cũng có thể tác động đến các quyết định của nhà đầu tư và các bên liên quan về việc ủng hộ doanh nghiệp.</p>

            <li>Các chủ nợ nhận được tiền lãi trước khi các cổ đông nhận được bất kỳ khoản cổ tức nào</li>
            <li>Khoản nợ thường được bảo đảm bằng các khoản thế chấp cố định (fixed charges) hoặc thế chấp thả nổi (floating charges). Thế chấp cố định gắn với các tài sản cụ thể, trong khi thế chấp thả nổi bao trùm một nhóm tài sản thay đổi. Các biện pháp bảo đảm này đảm bảo rằng bên cho vay sẽ được hoàn trả.</li>
            <li>Trong trường hợp công ty phá sản, các chủ nợ được xếp hạng ưu tiên cao hơn các cổ đông để nhận lại vốn của mình.</li>
            <li>'Cái giá' mà các chủ nợ phải trả là tỷ suất sinh lợi thấp hơn trên số vốn của họ.</li>

          <p>Bạn không cần phải có kiến thức chi tiết về các nguồn tài chính truyền thống vốn tập trung vào lợi nhuận tài chính và quản trị rủi ro tài chính. Trong Sách bài tập này, chúng ta sẽ tập trung vào tài chính gắn kết bền vững, vốn là một hình thức tài trợ bằng nợ.</p>

          <h2 class="h2-title">4.2 Các loại tài chính bền vững</h2>
          <p>Có hai loại tài chính bền vững chính:</p>
          <div class="box-def">
            <div class="box-def-label">Các định nghĩa</div>

            <p style="margin:0;"><strong>Tài chính sử dụng tiền thu được (Use of proceeds finance):</strong> Được sử dụng độc quyền cho các dự án hoặc hoạt động cụ thể nhằm tạo ra tác động tích cực đến các kết quả môi trường và/hoặc xã hội. Dự án hoặc hoạt động đó phải được chỉ rõ tại thời điểm vay.</p>
          </div>

          <h3 class="h3-title">4.2.1 Mối quan hệ giữa tài chính bền vững và các mục tiêu UN SDGs</h3>
          <p>Tài chính bền vững đóng một vai trò quan trọng trong việc hướng tới đạt được Các mục tiêu Phát triển Bền vững của Liên Hợp Quốc (SDGs) và Thỏa thuận Paris. Nó giúp đảm bảo rằng các nguồn lực tài chính được hướng tới các dự án và sáng kiến có tác động tích cực đến tính bền vững về kinh tế, xã hội và môi trường, trong khi tài chính truyền thống chỉ tập trung vào lợi nhuận tài chính.</p>
          <p>Tài chính bền vững đóng góp vào việc đạt được các mục tiêu UN SDGs bằng cách:</p>
          <ul class="icaew-list">
            <li>Thúc đẩy trách nhiệm doanh nghiệp thông qua việc cung cấp các ưu đãi khuyến khích các công ty hoàn thành các dự án hoặc đạt được các mục tiêu liên quan đến tính bền vững.</li>
            <li>Tăng cường tính minh bạch và trách nhiệm giải trình bằng cách yêu cầu các tổ chức phát hành hoặc bên nhận vốn báo cáo về cách họ đã sử dụng tiền thu được (tài chính sử dụng tiền thu được) hoặc tiến độ hướng tới việc đạt được các chỉ số KPI (tài chính gắn kết bền vững).</li>
            <li>Thu hẹp khoảng cách tài trợ cho các khoản đầu tư vào các dự án và hoạt động gắn kết với các mục tiêu SDGs.</li>
          </ul>

          <h2 class="h2-title">4.3 Tài chính gắn kết bền vững (Sustainability-linked finance)</h2>
          <p>Tài chính gắn kết bền vững đề cập đến các hình thức tài chính khuyến khích bên đi vay (doanh nghiệp) đạt được các mục tiêu hiệu quả bền vững cụ thể. Sự tăng trưởng và tính sẵn có của tài chính gắn kết bền vững đã giúp vượt qua một trong những rào cản lớn đối với tiến trình đã được thảo luận ở trên. Không giống như tài chính truyền thống vốn chủ yếu tập trung vào việc đạt được các kết quả tài chính, tài chính gắn kết bền vững gắn kết các điều khoản tài chính, chẳng hạn như lãi suất hoặc điều kiện hoàn trả, với hiệu quả bền vững của bên đi vay, và do đó là một phần quan trọng trong việc hỗ trợ và đưa ra các ưu đãi tài chính cho doanh nghiệp khi họ nỗ lực trở nên bền vững hơn.</p>
          <p>Các điều khoản của tài chính gắn kết bền vững được gắn liền với việc đạt được các mục tiêu bền vững đã được xác định trước. Các mục tiêu này gắn kết với các mục tiêu bền vững rộng lớn hơn của bên đi vay, chẳng hạn như cải thiện hiệu quả năng lượng hoặc đóng góp nhiều hơn cho các dự án cộng đồng địa phương, và do đó khuyến khích doanh nghiệp thiết lập và nỗ lực hướng tới các mục tiêu giúp họ đạt được mục tiêu chung.</p>

          <h2 class="h2-title">6.2 Tiêu chuẩn Doanh nghiệp của Nghị định thư Khí nhà kính (Greenhouse Gas Protocol Corporate Standard)</h2>
          <p>Nghị định thư Khí nhà kính (GHG Protocol) được thành lập vào năm 1998 nhằm tạo ra một phương pháp chuẩn hóa cho kế toán khí nhà kính, vốn là một phần quan trọng của cấu phần 'môi trường' trong các chỉ số ESG.</p>
          <p>Nghị định thư GHG đã ban hành 'Tiêu chuẩn Doanh nghiệp' (Corporate Standard) để cung cấp một khuôn khổ dựa trên cơ sở khoa học toàn cầu cho việc đo lường, quản lý và báo cáo phát thải khí nhà kính của doanh nghiệp trên toàn chuỗi giá trị. Định nghĩa về chuỗi giá trị trong Nghị định thư GHG tương tự như định nghĩa của ISSB đã nêu ở phần trước của chương này ở chỗ nó xem xét toàn bộ phạm vi hoạt động mà một doanh nghiệp thực hiện.</p>
          <p>Nghị định thư GHG cung cấp các phương pháp chuẩn hóa để tính toán và báo cáo phát thải khí nhà kính, giúp thúc đẩy tính nhất quán và khả năng so sánh giữa các loại hình doanh nghiệp, ngành nghề và khu vực địa lý khác nhau.</p>

          <p>Tẩy xanh có thể diễn ra dưới nhiều hình thức, ví dụ:</p>

          <p>Các công ty cũng đang đưa ra những tuyên bố gây hiểu lầm, phóng đại hoặc sai sự thật về dấu chân carbon của họ và về việc 'trung hòa carbon' (carbon neutral). Như ví dụ tiếp theo cho thấy, một số tuyên bố trung hòa carbon đạt được thuần túy thông qua việc mua tín chỉ bù đắp carbon, với rất ít sự minh bạch về kế hoạch cắt giảm phát thải của công ty hoặc liệu các tín chỉ bù đắp được mua có thực sự có giá trị hay không.</p>

              <div class="box-sol-label">Câu 4 — Đáp án đúng: C</div>
              <p style="margin:0;"><strong>C Bằng cách hướng các nguồn lực tài chính tới các dự án có tác động tích cực đến tính bền vững về kinh tế, xã hội và môi trường.</strong> Tài chính bền vững giúp thu hẹp khoảng cách tài trợ cho các khoản đầu tư gắn kết với các mục tiêu UN SDGs, thúc đẩy trách nhiệm doanh nghiệp và tăng cường tính minh bạch.</p>
            </div>

            <div class="box-sol" style="margin-bottom:7px;">
              <div class="box-sol-label">Câu 5 — Đáp án đúng</div>
              <ul class="icaew-list" style="margin:0;">
                <li><strong>Tài chính gắn kết bền vững (Sustainability-linked finance):</strong> Có thể được sử dụng cho các mục đích chung của doanh nghiệp thay vì một dự án riêng lẻ và khuyến khích bên đi vay đạt được các mục tiêu hiệu quả bền vững cụ thể (Mô tả 1).</li>
                <li><strong>Tài chính sử dụng tiền thu được (Use of proceeds finance):</strong> Được sử dụng độc quyền cho các dự án hoặc hoạt động cụ thể nhằm tạo ra tác động tích cực đến các kết quả môi trường và/hoặc xã hội (Mô tả 2).</li>
              </ul>
            </div>

            <div class="box-sol" style="margin-bottom:0;">
              <div class="box-sol-label">Câu 6 — Đáp án đúng: B</div>
              <p style="margin:0;"><strong>B Áp dụng cách tiếp cận toàn diện (Adopting a holistic approach).</strong> Một khía cạnh quan trọng của LCA là áp dụng cách tiếp cận toàn diện để tránh chuyển dịch tác động tiêu cực từ khía cạnh/giai đoạn này sang khía cạnh/giai đoạn khác (giảm tiêu thụ nước nhưng lại làm tăng đáng kể tiêu thụ điện năng và phát thải GHG).</p>
            </div>
          </div>
        `
      },

      // ==================== TRANG 55 ====================
      {
        page: 55,
        section: "Đáp án câu hỏi tự kiểm tra (Câu 7 đến Câu 10)",
        html: `
          <div class="h3-title" style="margin-top:0;">Đáp án câu hỏi tự kiểm tra (tiếp theo)</div>

          <div style="font-size:11.6px; line-height:1.48;">
            <div class="box-sol" style="margin-top:0; margin-bottom:10px;">
              <div class="box-sol-label">Câu 7 — Đáp án đúng: D</div>
              <p style="margin:0;"><strong>D Ước muốn xanh (Greenwishing).</strong> Ước muốn xanh là việc bày tỏ mong muốn hoặc đặt ra mục tiêu trở nên bền vững (như mục tiêu net-zero) mà không có kế hoạch chi tiết hay hành động cụ thể để biến điều đó thành hiện thực.</p>
            </div>

            <div class="box-sol" style="margin-bottom:10px;">
              <div class="box-sol-label">Câu 8 — Đáp án đúng: A</div>
              <p style="margin:0;"><strong>A Im lặng xanh (Greenhushing).</strong> Im lặng xanh là hành vi cố ý báo cáo dưới mức thực tế hoặc che giấu các nỗ lực bền vững thực chất của doanh nghiệp nhằm tránh sự soi xét kỹ lưỡng hoặc phản ứng dữ dội từ công chúng đối với các khía cạnh khác.</p>
            </div>

            <div class="box-sol" style="margin-bottom:10px;">
              <div class="box-sol-label">Câu 9 — Đáp án đúng: A</div>
              <p style="margin:0;"><strong>A Phát thải từ việc đốt nhiên liệu trong các nồi hơi thuộc sở hữu của công ty.</strong> Đây là phát thải trực tiếp từ các nguồn thuộc sở hữu hoặc kiểm soát của doanh nghiệp (Phạm vi 1). Phương án B là Phạm vi 2; Phương án C và D là Phạm vi 3.</p>
            </div>

            <div class="box-sol" style="margin-bottom:12px;">
              <div class="box-sol-label">Câu 10 — Đáp án đúng: B</div>
              <p style="margin:0;"><strong>B Trả cho nhân viên mức lương đủ sống (living wage) dựa trên quốc gia hoặc khu vực nơi họ làm việc.</strong> Đây là quyết định bền vững thuộc hoạt động hỗ trợ Quản trị nguồn nhân lực (HRM). Phương án A thuộc Hậu cần đầu vào, Phương án C thuộc Dịch vụ hậu mãi và Phương án D thuộc Hậu cần đầu ra.</p>
            </div>
          </div>

          <div style="margin-top:auto; background:#f0fdfa; border:1px solid #99f6e4; border-radius:8px; padding:12px 16px; text-align:center;">
            <div style="font-weight:800; color:#006b68; font-size:13px; margin-bottom:3px;">HOÀN THÀNH CHƯƠNG 4: TÍNH BỀN VỮNG TRONG KINH DOANH</div>
            <div style="font-size:11px; color:#334155;">Toàn bộ 55 trang tài liệu học tập ICAEW đã được dịch đầy đủ sang tiếng Việt.</div>
          </div>
        `
      }
    ];

    // =========================================================================
    // 3. DANH MỤC ĐIỀU HƯỚNG NHANH (MỤC LỤC)
    // =========================================================================
    const TOC_ITEMS = [
      { title: "Bìa Chương 4: Tính bền vững trong kinh doanh", page: 1 },
      { title: "Giới thiệu (Chuẩn đầu ra, Liên kết đề cương, Đánh giá)", page: 2 },
      { title: "Hướng dẫn học tập chương (Chủ đề 1–7)", page: 3 },
      { title: "Chủ đề 1: Các yếu tố ảnh hưởng đến chiến lược & hoạt động", page: 7 },
      { title: "  1.2 Chuỗi giá trị của Porter & Hình 4.1", page: 8 },
      { title: "  1.2.4 Liên kết tính bền vững với chuỗi giá trị", page: 9 },
      { title: "  1.2.5 Mua sắm & chuỗi cung ứng (Unilever-Novozyme)", page: 11 },
      { title: "  1.3 Lồng ghép chiến lược bền vững (Britvic)", page: 12 },
      { title: "  1.4 Các yếu tố ảnh hưởng & Câu hỏi tương tác 1", page: 13 },
      { title: "  1.5 Kế hoạch chuyển đổi (TPT) & Bù đắp carbon", page: 15 },
      { title: "Chủ đề 2: Các rào cản đối với tiến trình", page: 17 },
      { title: "  Ví dụ Xe điện & Lithium + Câu hỏi tương tác 2", page: 19 },
      { title: "Chủ đề 3: Tác động, sự phụ thuộc, rủi ro và cơ hội", page: 20 },
      { title: "  3.2 Rủi ro khí hậu (Vật lý & Chuyển đổi) + IQ3", page: 22 },
      { title: "  3.2.3 Khủng hoảng bảo hiểm California & Cơ hội + IQ4", page: 24 },
      { title: "  3.3 Giá trị doanh nghiệp và giá trị xã hội", page: 26 },
      { title: "Chủ đề 4: Tài chính bền vững", page: 27 },
      { title: "  4.3 Tài chính gắn kết bền vững (Enel & ICMA)", page: 28 },
      { title: "  4.4 Trái phiếu xanh, xanh dương, xã hội & Khoản vay xanh", page: 31 },
      { title: "Chủ đề 5: Đánh giá vòng đời (LCA) & Câu hỏi tương tác 5", page: 33 },
      { title: "Chủ đề 6: ESG và các thước đo tính bền vững", page: 36 },
      { title: "  6.2 Nghị định thư GHG & Hình 4.2 (Phạm vi 1, 2, 3)", page: 37 },
      { title: "  Câu hỏi tương tác 6 & 7 (Phạm vi 2 & 3)", page: 39 },
      { title: "Chủ đề 7: Truyền thông bền vững & Tẩy xanh", page: 41 },
      { title: "  Tẩy xanh, Chiếu đèn xanh, Tẩy xã hội, Im lặng & Ước muốn xanh", page: 42 },
      { title: "Tóm tắt Chương 4 (3 Sơ đồ tư duy trực quan)", page: 47 },
      { title: "Thực hành câu hỏi bổ sung & Tài liệu tham khảo", page: 50 },
      { title: "Câu hỏi tự kiểm tra (10 câu hỏi & Đáp án chi tiết)", page: 52 }
    ];

    // =========================================================================
    // 4. LOGIC QUẢN LÝ TRẠNG THÁI, SCALE A4 & LẬT TRANG
    // =========================================================================
    let currentPage = 1;
    let isTwoPageMode = false; // Mặc định 1 trang A4 nguyên trang để chữ to, sắc nét
    let userZoomMultiplier = 1.0;
    let activeSearchQuery = "";

    const stageEl = document.getElementById('stage');
    const bookScalerEl = document.getElementById('bookScaler');
    const bookSpreadEl = document.getElementById('bookSpread');
    const pageInputEl = document.getElementById('pageInput');
    const progressSliderEl = document.getElementById('progressSlider');
    const currentSectionLabelEl = document.getElementById('currentSectionLabel');
    const zoomPercentLabelEl = document.getElementById('zoomPercentLabel');

    // Tự động tính toán tỷ lệ scale để trang A4 (794x1123) luôn vừa khít khung nhìn
    function fitBookToViewport() {
      const rect = stageEl.getBoundingClientRect();
      const padW = isTwoPageMode ? 96 : 88;
      const padH = 26;
      const availW = Math.max(300, rect.width - padW);
      const availH = Math.max(300, rect.height - padH);

      const targetW = isTwoPageMode ? 794 * 2 : 794;
      const targetH = 1123;

      const scaleX = availW / targetW;
      const scaleY = availH / targetH;
      const baseScale = Math.min(scaleX, scaleY);
      const finalScale = baseScale * userZoomMultiplier;

      bookScalerEl.style.transform = `scale(${finalScale.toFixed(4)})`;
      zoomPercentLabelEl.textContent = userZoomMultiplier === 1
        ? `Fit (${Math.round(finalScale * 100)}%)`
        : `${Math.round(finalScale * 100)}%`;
    }

    // Tô sáng từ khóa tìm kiếm nếu đang tìm
    function applyHighlight(htmlStr, query) {
      if (!query || query.trim().length < 2) return htmlStr;
      const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const regex = new RegExp(`(${escaped})(?![^<]*>)`, 'gi');
      return htmlStr.replace(regex, '<mark class="highlight-mark">$1</mark>');
    }

    // Render một tờ giấy A4 chuẩn
    function createA4Sheet(pageObj, sideClass = '') {
      if (!pageObj) {
        return `<div class="a4-sheet ${sideClass}" style="background:#f1f5f9;"></div>`;
      }
      const processedHtml = applyHighlight(pageObj.html, activeSearchQuery);
      if (pageObj.isCover) {
        return `<div class="a4-sheet ${sideClass}">${processedHtml}</div>`;
      }
      return `
        <div class="a4-sheet ${sideClass}">
          <div class="page-header">
            <span style="font-weight:700; color:#006b68;">ICAEW • TÍNH BỀN VỮNG VÀ ĐẠO ĐỨC</span>
            <span style="max-width:440px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${pageObj.section}</span>
          </div>
          <div class="page-body">
            ${processedHtml}
          </div>
          <div class="page-footer">
            <span>Chương 4: Tính bền vững trong kinh doanh</span>
            <span style="font-weight:700; color:#0f172a;">Trang ${pageObj.page} / 55</span>
          </div>
        </div>
      `;
    }

    // Render toàn bộ khung sách hiện tại
    function renderBook(direction = null) {
      bookSpreadEl.className = `book-spread ${isTwoPageMode ? 'two-page' : 'one-page'}`;

      if (!isTwoPageMode) {
        const pData = PAGES_DATA[currentPage - 1];
        bookSpreadEl.innerHTML = createA4Sheet(pData);
        currentSectionLabelEl.textContent = `Trang ${currentPage}: ${pData.section}`;
      } else {
        // Trong chế độ 2 trang: Trang 1 hiển thị lẻ, các trang sau mở theo cặp (2-3, 4-5, ...)
        if (currentPage === 1) {
          const p1 = PAGES_DATA[0];
          bookSpreadEl.innerHTML = createA4Sheet(p1);
          currentSectionLabelEl.textContent = `Trang 1: ${p1.section}`;
        } else {
          const leftNum = currentPage % 2 === 0 ? currentPage : currentPage - 1;
          const rightNum = leftNum + 1;
          const leftData = PAGES_DATA[leftNum - 1];
          const rightData = rightNum <= 55 ? PAGES_DATA[rightNum - 1] : null;
          bookSpreadEl.innerHTML = createA4Sheet(leftData, 'left-page') + createA4Sheet(rightData, 'right-page');
          currentSectionLabelEl.textContent = rightData
            ? `Trang ${leftNum}–${rightNum}: ${leftData.section}`
            : `Trang ${leftNum}: ${leftData.section}`;
        }
      }

      if (direction === 'next') {
        bookSpreadEl.classList.remove('anim-flip-next', 'anim-flip-prev');
        void bookSpreadEl.offsetWidth;
        bookSpreadEl.classList.add('anim-flip-next');
      } else if (direction === 'prev') {
        bookSpreadEl.classList.remove('anim-flip-next', 'anim-flip-prev');
        void bookSpreadEl.offsetWidth;
        bookSpreadEl.classList.add('anim-flip-prev');
      }

      pageInputEl.value = currentPage;
      progressSliderEl.value = currentPage;

      document.getElementById('btnPrev').disabled = currentPage <= 1;
      document.getElementById('floatPrev').disabled = currentPage <= 1;
      document.getElementById('btnFirst').disabled = currentPage <= 1;

      const maxReached = isTwoPageMode && currentPage > 1
        ? (currentPage % 2 === 0 ? currentPage + 1 >= 55 : currentPage >= 55)
        : currentPage >= 55;

      document.getElementById('btnNext').disabled = maxReached;
      document.getElementById('floatNext').disabled = maxReached;
      document.getElementById('btnLast').disabled = maxReached;

      fitBookToViewport();
    }

    function goToPage(targetPage, playAudio = true) {
      const clamped = Math.max(1, Math.min(55, parseInt(targetPage, 10) || 1));
      if (clamped === currentPage) return;
      const dir = clamped > currentPage ? 'next' : 'prev';
      currentPage = clamped;
      if (playAudio) soundEngine.playFlip();
      renderBook(dir);
    }

    function nextPage() {
      if (!isTwoPageMode) {
        if (currentPage < 55) goToPage(currentPage + 1, true);
      } else {
        if (currentPage === 1) {
          goToPage(2, true);
        } else {
          const leftNum = currentPage % 2 === 0 ? currentPage : currentPage - 1;
          if (leftNum + 2 <= 55) goToPage(leftNum + 2, true);
        }
      }
    }

    function prevPage() {
      if (!isTwoPageMode) {
        if (currentPage > 1) goToPage(currentPage - 1, true);
      } else {
        if (currentPage <= 3) {
          goToPage(1, true);
        } else {
          const leftNum = currentPage % 2 === 0 ? currentPage : currentPage - 1;
          goToPage(Math.max(1, leftNum - 2), true);
        }
      }
    }

    // =========================================================================
    // 5. KHỞI TẠO MỤC LỤC, TÌM KIẾM & SỰ KIỆN TƯƠNG TÁC
    // =========================================================================
    function buildToc() {
      const tocList = document.getElementById('tocList');
      tocList.innerHTML = TOC_ITEMS.map(item => `
        <button onclick="goToPage(${item.page}); document.getElementById('tocDrawer').classList.remove('open');"
          class="w-full text-left px-3 py-2 rounded-lg hover:bg-teal-800/50 text-slate-200 hover:text-white flex items-center justify-between gap-2 transition">
          <span class="truncate">${item.title}</span>
          <span class="text-[11px] font-mono text-teal-400 shrink-0">Tr. ${item.page}</span>
        </button>
      `).join('');
    }

    function performSearch(query) {
      activeSearchQuery = query.trim();
      const resultsEl = document.getElementById('searchResults');
      const statsEl = document.getElementById('searchStats');

      if (activeSearchQuery.length < 2) {
        statsEl.textContent = "Nhập ít nhất 2 ký tự để tìm kiếm";
        resultsEl.innerHTML = "";
        renderBook();
        return;
      }

      const lowerQ = activeSearchQuery.toLowerCase();
      const matches = [];

      PAGES_DATA.forEach(p => {
        const plainText = p.html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
        const idx = plainText.toLowerCase().indexOf(lowerQ);
        if (idx !== -1) {
          const start = Math.max(0, idx - 45);
          const end = Math.min(plainText.length, idx + activeSearchQuery.length + 65);
          const snippet = (start > 0 ? "..." : "") + plainText.slice(start, end) + (end < plainText.length ? "..." : "");
          matches.push({ page: p.page, section: p.section, snippet });
        }
      });

      statsEl.textContent = `Tìm thấy ${matches.length} trang chứa "${activeSearchQuery}"`;
      resultsEl.innerHTML = matches.map(m => `
        <button onclick="goToPage(${m.page});" class="w-full text-left p-2.5 rounded-lg bg-slate-800/80 hover:bg-teal-900/50 border border-slate-700 transition">
          <div class="flex justify-between items-center text-[11px] font-bold text-teal-300 mb-1">
            <span>Trang ${m.page}</span>
            <span class="truncate max-w-[190px] text-slate-400 font-normal">${m.section}</span>
          </div>
          <div class="text-[11.5px] text-slate-300 leading-snug">${applyHighlight(m.snippet, activeSearchQuery)}</div>
        </button>
      `).join('');

      renderBook();
    }

    // Gán sự kiện nút bấm
    document.getElementById('btnPrev').addEventListener('click', prevPage);
    document.getElementById('floatPrev').addEventListener('click', prevPage);
    document.getElementById('btnNext').addEventListener('click', nextPage);
    document.getElementById('floatNext').addEventListener('click', nextPage);
    document.getElementById('btnFirst').addEventListener('click', () => goToPage(1, true));
    document.getElementById('btnLast').addEventListener('click', () => goToPage(55, true));

    pageInputEl.addEventListener('change', (e) => goToPage(e.target.value, true));
    progressSliderEl.addEventListener('input', (e) => goToPage(e.target.value, false));

    document.getElementById('btnViewMode').addEventListener('click', () => {
      isTwoPageMode = !isTwoPageMode;
      document.getElementById('viewModeLabel').textContent = isTwoPageMode ? '2 Trang A4' : '1 Trang A4';
      document.getElementById('btnViewMode').classList.toggle('active', isTwoPageMode);
      renderBook();
    });

    document.getElementById('btnZoomIn').addEventListener('click', () => {
      userZoomMultiplier = Math.min(2.2, +(userZoomMultiplier + 0.15).toFixed(2));
      fitBookToViewport();
    });

    document.getElementById('btnZoomOut').addEventListener('click', () => {
      userZoomMultiplier = Math.max(0.6, +(userZoomMultiplier - 0.15).toFixed(2));
      fitBookToViewport();
    });

    document.getElementById('btnZoomReset').addEventListener('click', () => {
      userZoomMultiplier = 1.0;
      fitBookToViewport();
    });

    document.getElementById('btnSound').addEventListener('click', () => {
      soundEngine.enabled = !soundEngine.enabled;
      document.getElementById('btnSound').classList.toggle('active', soundEngine.enabled);
      document.getElementById('soundIcon').textContent = soundEngine.enabled ? '🔊' : '🔇';
      if (soundEngine.enabled) soundEngine.playFlip();
    });

    // Mục lục & Tìm kiếm drawers
    const tocDrawer = document.getElementById('tocDrawer');
    const searchDrawer = document.getElementById('searchDrawer');

    document.getElementById('btnToc').addEventListener('click', () => {
      tocDrawer.classList.toggle('open');
      searchDrawer.classList.remove('open');
    });
    document.getElementById('closeToc').addEventListener('click', () => tocDrawer.classList.remove('open'));

    document.getElementById('btnSearch').addEventListener('click', () => {
      searchDrawer.classList.toggle('open');
      tocDrawer.classList.remove('open');
      if (searchDrawer.classList.contains('open')) {
        document.getElementById('searchInput').focus();
      }
    });
    document.getElementById('closeSearch').addEventListener('click', () => searchDrawer.classList.remove('open'));
    document.getElementById('searchInput').addEventListener('input', (e) => performSearch(e.target.value));

    // Toàn màn hình
    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Tải về file HTML độc lập
    document.getElementById('btnDownload').addEventListener('click', () => {
      const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Chuong_4_Tinh_ben_vung_trong_kinh_doanh_ICAEW_Flipbook.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    // Điều hướng bàn phím
    document.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'ArrowLeft') prevPage();
    });

    // Thao tác vuốt trên màn hình cảm ứng
    let touchStartX = 0;
    stageEl.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    stageEl.addEventListener('touchend', (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 45) {
        if (diff < 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    window.addEventListener('resize', fitBookToViewport);

    // Khởi chạy ứng dụng
    buildToc();
    renderBook();
  </script>
</body>
